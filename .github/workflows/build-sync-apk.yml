name: Build Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-sync

permissions:
  contents: read

concurrency:
  group: android-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      NODE_VERSION: '22.23.2'
      PNPM_VERSION: '10.15.0'
      JAVA_VERSION: '17.0.20+8'
      RUST_VERSION: '1.97.1'
      ANDROID_COMPILE_SDK_VERSION: '36'
      ANDROID_BUILD_TOOLS_VERSION: '37.0.0'
      NDK_VERSION: '29.0.13846066'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 peeled commit
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action revision
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: ''

      - name: Install pinned Android SDK packages
        run: |
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK_VERSION}"
          sdkmanager "ndk;${NDK_VERSION}"
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Build arm64 debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: pnpm tauri android build --debug --apk --target aarch64

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-debug.apk" -type f | head -n 1)
          test -n "$apk"
          cp "$apk" artifacts/VCPMobile-cloud-sync-arm64-debug.apk
          sha256sum artifacts/VCPMobile-cloud-sync-arm64-debug.apk > artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCPMobile-cloud-sync-arm64-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
