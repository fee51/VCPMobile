name: SyncHub Hotfix Check

on:
  push:
    branches: ["hotfix/synchub-legacy-attachments"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.15.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Install Linux host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: TypeScript and Rust static check
        run: pnpm check
      - name: Frontend regression tests
        run: pnpm test:run
      - name: SyncHub, Wire pull, persistence and settings regression tests
        working-directory: src-tauri
        run: |
          cargo test --locked --lib sync_hub::tests
          cargo test --locked --lib pull_executor::tests
          cargo test --locked --lib db_write_queue::tests
          cargo test --locked --lib settings_manager::tests
