name: SyncHub Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v1.2-acoustic-synchub
    paths:
      - .github/workflows/synchub-signed-release.yml

permissions:
  contents: write

concurrency:
  group: synchub-signed-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      NODE_VERSION: '22.23.2'
      PNPM_VERSION: '10.15.0'
      JAVA_VERSION: '17.0.20+8'
      NDK_VERSION: '29.0.13846066'
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/release.keystore
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97.1'
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: ''
      - name: Install SDK and dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;${NDK_VERSION}"
          pnpm install --frozen-lockfile
          pnpm exec vue-tsc --noEmit
      - name: Restore original signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!key}"
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          alias="$ANDROID_KEY_ALIAS"
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$alias" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            alias=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD | sed -n 's/^Alias name: //p' | head -n 1)
          fi
          test -n "$alias"
          echo "::add-mask::$alias"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$alias" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null
          echo "ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VCP_TRUSTED_LAN_MODE: enabled
        run: |
          pnpm tauri android build --apk --target aarch64
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
      - name: Verify upgrade identity and collect
        run: |
          set -euo pipefail
          tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          mkdir -p previous release-artifacts
          gh release download v1.1.12 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' -type f)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > new-cert.txt
          "$tools/apksigner" verify --verbose --print-certs previous/*.apk > old-cert.txt
          ! grep -qi 'Android Debug' new-cert.txt
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' new-cert.txt > new.sha
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' old-cert.txt > old.sha
          test -s new.sha
          cmp old.sha new.sha
          "$tools/aapt" dump badging "$apk" > badging.txt
          grep -Eq "^package: name='com.vcp.avatar' .*versionCode='1002000' .*versionName='1.2.0'" badging.txt
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package.json'));const t=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));if(p.version!=='1.2.0'||t.version!=='1.2.0')process.exit(1)"
          cp "$apk" release-artifacts/VCPMobile_v1.2.0_arm64-v8a.apk
          cd release-artifacts
          sha256sum VCPMobile_v1.2.0_arm64-v8a.apk > VCPMobile_v1.2.0_arm64-v8a.apk.sha256
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCPMobile-v1.2.0-signed
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish installable update
        run: |
          set -euo pipefail
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists; refusing overwrite" >&2
            exit 1
          fi
          gh release create v1.2.0 release-artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VCPMobile v1.2.0 — SyncHub integration" --notes "正式签名升级包。整合上游新版功能与 fee51 SyncHub；已通过 Android 构建、包名/版本码校验及与 v1.1.12 的签名证书比对。真机聊天、数据迁移与双向同步仍待验证，升级前请备份重要记录。" --draft
          gh release edit v1.2.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Remove signing key
        if: always()
        run: rm -f -- "$ANDROID_KEYSTORE_PATH"